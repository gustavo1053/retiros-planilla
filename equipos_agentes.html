<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Control de Equipos</title>
<style>
  :root{
    --bg: #12151a;
    --panel: #1a1f27;
    --panel-2: #212733;
    --line: #2a3140;
    --text: #e8ebf0;
    --text-dim: #8b93a3;
    --accent: #4fb0ff;
    --accent-dim: #2c6ba3;
    --ok: #3ecf8e;
    --warn: #e8a33d;
    --radius: 10px;
    --mono: 'SF Mono', 'Consolas', 'Menlo', monospace;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    min-height:100vh;
    padding: 20px 14px 100px;
  }
  .wrap{ max-width: 760px; margin: 0 auto; }

  @media (max-width: 420px){
    body{ padding: 14px 10px 100px; }
    .card{ padding: 14px; }
  }

  header{ margin-bottom: 22px; }
  header h1{
    font-size: 1.4rem;
    font-weight: 650;
    margin: 0 0 4px;
    letter-spacing: -0.01em;
  }
  header p{
    margin:0;
    color: var(--text-dim);
    font-size: 0.88rem;
  }

  .card{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 18px;
    margin-bottom: 16px;
  }

  .field{ margin-bottom: 18px; }
  .field:last-child{ margin-bottom:0; }
  label{
    display:block;
    font-size: 0.8rem;
    color: var(--text-dim);
    margin-bottom: 7px;
  }
  select, input[type="number"]{
    width:100%;
    background: var(--panel-2);
    border: 1px solid var(--line);
    color: var(--text);
    padding: 13px 12px;
    border-radius: 8px;
    font-size: 1rem;
    font-family: inherit;
  }
  select:focus, input:focus{
    outline: none;
    border-color: var(--accent-dim);
  }

  .row2{ display:grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  .cuentas-grid{
    display:grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
  }
  .cuenta-chip{
    display:flex;
    align-items:center;
    gap: 9px;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 13px 12px;
    cursor:pointer;
    user-select:none;
    font-size: 0.88rem;
    transition: background .12s, border-color .12s;
  }
  .cuenta-chip .dot{
    width: 9px; height: 9px;
    border-radius: 50%;
    background: var(--line);
    flex-shrink:0;
    transition: background .12s;
  }
  .cuenta-chip.active{
    background: rgba(62, 207, 142, 0.14);
    border-color: var(--ok);
    color: var(--ok);
  }
  .cuenta-chip.active .dot{
    background: var(--ok);
  }
  .cuentas-count{
    font-size: 0.78rem;
    color: var(--text-dim);
    margin-top: 8px;
  }

  .photo-actions{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .photo-action-btn{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap: 6px;
    background: var(--panel-2);
    border: 1.5px dashed var(--line);
    border-radius: 10px;
    padding: 18px 10px;
    cursor:pointer;
    position:relative;
    font-size: 0.82rem;
    color: var(--text);
    min-height: 78px;
    transition: border-color .15s, background .15s;
  }
  .photo-action-btn:active{
    border-color: var(--accent);
    background: rgba(79,176,255,0.08);
  }
  .photo-action-btn .icon{ font-size: 1.5rem; line-height:1; }
  .photo-action-btn input[type="file"]{
    position:absolute; inset:0; opacity:0; cursor:pointer;
  }

  .foto-grid{
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-top: 12px;
  }
  .foto-grid .foto-item{
    position:relative;
    aspect-ratio: 1;
    border-radius: 8px;
    overflow:hidden;
    background: var(--panel-2);
  }
  .foto-grid .foto-item img{
    width:100%; height:100%;
    object-fit: cover;
    display:block;
  }
  .foto-grid .foto-item .remove-photo{
    position:absolute; top:4px; right:4px;
    background: rgba(0,0,0,.7);
    color:#fff; border:none; border-radius:50%;
    width:26px; height:26px; cursor:pointer; font-size:14px;
    line-height:1;
  }
  .foto-count-hint{
    font-size: 0.78rem;
    color: var(--text-dim);
    margin-top: 8px;
  }

  .btn{
    width:100%;
    background: var(--accent);
    color: #06141f;
    border:none;
    padding: 15px;
    border-radius: 8px;
    font-size: 1rem;
    font-weight: 650;
    cursor:pointer;
    margin-top: 18px;
  }
  .btn:disabled{ opacity: 0.5; cursor:not-allowed; }
  .btn:active:not(:disabled){ transform: scale(0.99); }

  .status-line{
    font-size: 0.82rem;
    margin-top: 10px;
    color: var(--text-dim);
    min-height: 1.1em;
  }
  .status-line.ok{ color: var(--ok); }
  .status-line.err{ color: #ff6b6b; }

  .section-title{
    font-size: 0.9rem;
    color: var(--text-dim);
    margin: 26px 0 10px;
    padding-left: 2px;
  }

  .agent-list{ display:flex; flex-direction:column; gap: 8px; }
  .agent-row{
    display:flex;
    align-items:flex-start;
    gap: 12px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 10px 12px;
    cursor:pointer;
  }
  .agent-row .thumb{
    width: 46px; height: 46px;
    border-radius: 6px;
    object-fit: cover;
    background: var(--panel-2);
    flex-shrink:0;
  }
  .agent-row .thumb-wrap{
    position:relative;
    flex-shrink:0;
  }
  .agent-row .thumb-wrap .badge{
    position:absolute;
    bottom: -4px; right: -4px;
    background: var(--accent);
    color: #06141f;
    font-size: 0.62rem;
    font-weight: 700;
    border-radius: 8px;
    padding: 1px 5px;
    line-height: 1.3;
  }
  .agent-row .thumb.empty{
    display:flex; align-items:center; justify-content:center;
    color: var(--text-dim); font-size: 0.7rem;
    border: 1px dashed var(--line);
  }
  .agent-row .info{ flex:1; min-width:0; }
  .agent-row .info .name{
    font-weight: 600;
    font-size: 0.92rem;
    display:flex; align-items:center; gap:8px;
  }
  .agent-row .info .shift-tag{
    font-size: 0.66rem;
    color: var(--text-dim);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 1px 6px;
    font-weight: 500;
  }
  .agent-row .info .meta{
    font-size: 0.8rem;
    color: var(--text-dim);
    margin-top: 2px;
  }
  .agent-row .meta .n-cuentas{
    color: var(--accent);
    font-family: var(--mono);
    font-weight: 600;
  }
  .agent-row .cuentas-tags{
    display:flex;
    flex-wrap:wrap;
    gap: 5px;
    margin-top: 6px;
  }
  .agent-row .cuentas-tags .tag{
    font-size: 0.68rem;
    padding: 2px 7px;
    border-radius: 5px;
    background: rgba(62, 207, 142, 0.14);
    border: 1px solid var(--ok);
    color: var(--ok);
    font-weight: 600;
  }
  .agent-row .cuentas-tags .tag-none{
    font-size: 0.72rem;
    color: var(--text-dim);
    font-style: italic;
  }
  .agent-row .empty-note{
    color: var(--text-dim);
    font-size: 0.8rem;
    font-style: italic;
  }

  .modal-overlay{
    position:fixed; inset:0;
    background: rgba(0,0,0,.75);
    display:none;
    align-items:center; justify-content:center;
    z-index: 50;
    padding: 20px;
  }
  .modal-overlay.open{ display:flex; }
  .modal-overlay img{
    max-width: 100%;
    max-height: 85vh;
    border-radius: 10px;
  }
  .modal-nav{
    position:fixed;
    top:50%;
    transform: translateY(-50%);
    background: rgba(0,0,0,.6);
    color:#fff;
    border:none;
    width: 44px; height: 44px;
    border-radius:50%;
    font-size: 1.3rem;
    cursor:pointer;
    z-index: 51;
  }
  .modal-nav.prev{ left: 12px; }
  .modal-nav.next{ right: 12px; }
  .modal-counter{
    position:fixed;
    bottom: 24px;
    left:50%;
    transform: translateX(-50%);
    color: var(--text-dim);
    font-size: 0.8rem;
    z-index: 51;
  }

  .empty-state{
    text-align:center;
    color: var(--text-dim);
    font-size: 0.85rem;
    padding: 20px;
  }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>Control de Equipos</h1>
    <p>Estado de cuentas y notebook por agente</p>
  </header>

  <div class="card">
    <div class="field">
      <label for="selAgente">Agente</label>
      <select id="selAgente">
        <option value="">Seleccionar agente...</option>
      </select>
    </div>

    <div class="field">
      <label for="inpNombre">Nombre de operador</label>
      <input type="text" id="inpNombre" placeholder="Ej: Juan Pérez">
    </div>

    <div class="field">
      <label for="selTurno">Turno</label>
      <select id="selTurno">
        <option value="Mañana">Mañana</option>
        <option value="Tarde">Tarde</option>
        <option value="Noche">Noche</option>
      </select>
    </div>

    <div class="field">
      <label>Cuentas activas</label>
      <div class="cuentas-grid" id="cuentasGrid"></div>
      <div class="cuentas-count" id="cuentasCount"></div>
    </div>

    <div class="field">
      <label for="inpMarca">Marca de notebook</label>
      <select id="inpMarca">
        <option value="">Seleccionar...</option>
        <option>Lenovo</option>
        <option>HP</option>
        <option>Dell</option>
        <option>Asus</option>
        <option>Acer</option>
        <option>Apple</option>
        <option>Samsung</option>
        <option>Otra</option>
      </select>
    </div>

    <div class="field">
      <label>Fotos de la notebook</label>
      <div class="photo-actions">
        <div class="photo-action-btn" id="btnTomarFoto">
          <span class="icon">📷</span>
          <span>Sacar foto</span>
          <input type="file" id="inpFotoCamara" accept="image/*" capture="environment">
        </div>
        <div class="photo-action-btn" id="btnGaleria">
          <span class="icon">🖼️</span>
          <span>Elegir de galería</span>
          <input type="file" id="inpFotoGaleria" accept="image/*" multiple>
        </div>
      </div>
      <div class="foto-grid" id="fotoGrid"></div>
      <div class="foto-count-hint" id="fotoCountHint"></div>
    </div>

    <button class="btn" id="btnGuardar">Guardar registro</button>
    <div class="status-line" id="statusLine"></div>
  </div>

  <div class="section-title">Titulares</div>
  <div class="agent-list" id="agentListTitulares">
    <div class="empty-state">Cargando...</div>
  </div>

  <div class="section-title">Cubren francos</div>
  <div class="agent-list" id="agentListFranco">
    <div class="empty-state">Cargando...</div>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <button class="modal-nav prev" id="modalPrev" style="display:none;">‹</button>
  <img id="modalImg" src="">
  <button class="modal-nav next" id="modalNext" style="display:none;">›</button>
  <div class="modal-counter" id="modalCounter"></div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getFirestore, doc, setDoc, onSnapshot, collection, serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey:            "AIzaSyCGRYyo9EmR0NB3TImzZIP4SuDpDwwMgVc",
    authDomain:        "planilla-perdidas---ganancias.firebaseapp.com",
    projectId:         "planilla-perdidas---ganancias",
    storageBucket:     "planilla-perdidas---ganancias.firebasestorage.app",
    messagingSenderId: "179047310261",
    appId:             "1:179047310261:web:2e5ad044d98751985d2ffc"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const COLLECTION = "equipos_agentes";

  const AGENTES_TITULARES = ["AGE 18","AGE 19","AGE 21","AGE 22","AGE 23","AGE 24","AGE 25","Siempre Mono"];
  const AGENTES_FRANCO = ["FLOR","LUDMILA","SOFIA","VALU"];
  const AGENTES = [...AGENTES_TITULARES, ...AGENTES_FRANCO];
  const CUENTAS = ["Personal Pay","Claro Pay","AstroPay","Prex","NX","Lemon","Uala","Mercado Pago","ARQ","Buepp","Belo"];

  const slug = (name) => name.toLowerCase().replace(/\s+/g, "_");

  let cuentasState = {}; // { "Personal Pay": true/false, ... }

  function resetCuentasState(fromData){
    cuentasState = {};
    CUENTAS.forEach(c => { cuentasState[c] = fromData ? !!fromData[c] : false; });
  }
  resetCuentasState(null);

  const cuentasGrid = document.getElementById("cuentasGrid");
  const cuentasCount = document.getElementById("cuentasCount");

  function renderCuentasGrid(){
    cuentasGrid.innerHTML = "";
    CUENTAS.forEach(nombre => {
      const chip = document.createElement("div");
      chip.className = "cuenta-chip" + (cuentasState[nombre] ? " active" : "");
      chip.innerHTML = `<span class="dot"></span><span>${nombre}</span>`;
      chip.addEventListener("click", () => {
        cuentasState[nombre] = !cuentasState[nombre];
        renderCuentasGrid();
      });
      cuentasGrid.appendChild(chip);
    });
    const activeCount = Object.values(cuentasState).filter(Boolean).length;
    cuentasCount.textContent = `${activeCount} de ${CUENTAS.length} activas`;
  }
  renderCuentasGrid();

  // --- Poblar select de agentes ---
  const selAgente = document.getElementById("selAgente");
  const optgroupTitulares = document.createElement("optgroup");
  optgroupTitulares.label = "Titulares";
  AGENTES_TITULARES.forEach(a => {
    const opt = document.createElement("option");
    opt.value = a;
    opt.textContent = a;
    optgroupTitulares.appendChild(opt);
  });
  selAgente.appendChild(optgroupTitulares);

  const optgroupFranco = document.createElement("optgroup");
  optgroupFranco.label = "Cubren francos";
  AGENTES_FRANCO.forEach(a => {
    const opt = document.createElement("option");
    opt.value = a;
    opt.textContent = a;
    optgroupFranco.appendChild(opt);
  });
  selAgente.appendChild(optgroupFranco);

  const selTurno = document.getElementById("selTurno");
  const inpNombre = document.getElementById("inpNombre");
  const inpMarca = document.getElementById("inpMarca");
  const inpFotoCamara = document.getElementById("inpFotoCamara");
  const inpFotoGaleria = document.getElementById("inpFotoGaleria");
  const fotoGrid = document.getElementById("fotoGrid");
  const fotoCountHint = document.getElementById("fotoCountHint");
  const btnGuardar = document.getElementById("btnGuardar");
  const statusLine = document.getElementById("statusLine");
  const agentListTitulares = document.getElementById("agentListTitulares");
  const agentListFranco = document.getElementById("agentListFranco");
  const modalOverlay = document.getElementById("modalOverlay");
  const modalImg = document.getElementById("modalImg");
  const modalPrev = document.getElementById("modalPrev");
  const modalNext = document.getElementById("modalNext");
  const modalCounter = document.getElementById("modalCounter");

  let currentFotos = []; // array de base64, refleja lo que se va a guardar
  let cachedData = {};
  let modalFotos = [];
  let modalIndex = 0;

  function setStatus(msg, type){
    statusLine.textContent = msg || "";
    statusLine.className = "status-line" + (type ? " " + type : "");
  }

  function getFotosDe(data){
    if (!data) return [];
    if (Array.isArray(data.fotos)) return data.fotos;
    if (data.fotoBase64) return [data.fotoBase64]; // compatibilidad con registros viejos
    return [];
  }

  function renderFotoGrid(){
    fotoGrid.innerHTML = "";
    currentFotos.forEach((src, idx) => {
      const item = document.createElement("div");
      item.className = "foto-item";
      item.innerHTML = `<img src="${src}"><button type="button" class="remove-photo">✕</button>`;
      item.querySelector(".remove-photo").addEventListener("click", () => {
        currentFotos.splice(idx, 1);
        renderFotoGrid();
      });
      fotoGrid.appendChild(item);
    });
    fotoCountHint.textContent = currentFotos.length
      ? `${currentFotos.length} foto${currentFotos.length > 1 ? "s" : ""} cargada${currentFotos.length > 1 ? "s" : ""}`
      : "Sin fotos cargadas todavía";
  }

  function compressImage(file){
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const maxW = 800;
          const scale = Math.min(1, maxW / img.width);
          const canvas = document.createElement("canvas");
          canvas.width = img.width * scale;
          canvas.height = img.height * scale;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          resolve(canvas.toDataURL("image/jpeg", 0.7));
        };
        img.onerror = reject;
        img.src = e.target.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  async function handleFilesSelected(fileList){
    const files = Array.from(fileList || []);
    if (!files.length) return;
    setStatus("Procesando foto" + (files.length > 1 ? "s" : "") + "...");
    try {
      for (const file of files) {
        const compressed = await compressImage(file);
        currentFotos.push(compressed);
      }
      renderFotoGrid();
      setStatus("");
    } catch(err){
      setStatus("No se pudo procesar la foto.", "err");
    }
  }

  inpFotoCamara.addEventListener("change", (e) => {
    handleFilesSelected(e.target.files);
    e.target.value = "";
  });
  inpFotoGaleria.addEventListener("change", (e) => {
    handleFilesSelected(e.target.files);
    e.target.value = "";
  });
  renderFotoGrid();

  // --- Al elegir agente, precargar sus datos actuales ---
  selAgente.addEventListener("change", () => {
    const agente = selAgente.value;
    const data = cachedData[agente];
    if (data) {
      inpNombre.value = data.nombreAgente || "";
      selTurno.value = data.turno || "Mañana";
      resetCuentasState(data.cuentasActivas || null);
      inpMarca.value = data.marcaNotebook || "";
      currentFotos = [...getFotosDe(data)];
    } else {
      inpNombre.value = "";
      selTurno.value = "Mañana";
      resetCuentasState(null);
      inpMarca.value = "";
      currentFotos = [];
    }
    renderCuentasGrid();
    renderFotoGrid();
    setStatus("");
  });

  // --- Guardar ---
  btnGuardar.addEventListener("click", async () => {
    const agente = selAgente.value;
    if (!agente) { setStatus("Elegí un agente.", "err"); return; }
    if (!inpNombre.value.trim()) { setStatus("Ingresá el nombre de quien está en el puesto.", "err"); return; }
    if (!inpMarca.value) { setStatus("Elegí la marca de notebook.", "err"); return; }

    btnGuardar.disabled = true;
    setStatus("Guardando...");

    try {
      await setDoc(doc(db, COLLECTION, slug(agente)), {
        agente,
        nombreAgente: inpNombre.value.trim(),
        turno: selTurno.value,
        cuentasActivas: { ...cuentasState },
        marcaNotebook: inpMarca.value,
        fotos: [...currentFotos],
        fotoBase64: null,
        ultimaActualizacion: serverTimestamp()
      });
      setStatus("Guardado ✓", "ok");
    } catch(err){
      console.error(err);
      setStatus("Error al guardar: " + err.message, "err");
    } finally {
      btnGuardar.disabled = false;
    }
  });

  function openModal(fotos, index){
    modalFotos = fotos;
    modalIndex = index;
    updateModalImg();
    modalOverlay.classList.add("open");
  }
  function updateModalImg(){
    modalImg.src = modalFotos[modalIndex];
    const multi = modalFotos.length > 1;
    modalPrev.style.display = multi ? "block" : "none";
    modalNext.style.display = multi ? "block" : "none";
    modalCounter.textContent = multi ? `${modalIndex + 1} / ${modalFotos.length}` : "";
  }
  modalPrev.addEventListener("click", (ev) => {
    ev.stopPropagation();
    modalIndex = (modalIndex - 1 + modalFotos.length) % modalFotos.length;
    updateModalImg();
  });
  modalNext.addEventListener("click", (ev) => {
    ev.stopPropagation();
    modalIndex = (modalIndex + 1) % modalFotos.length;
    updateModalImg();
  });

  // --- Listado en vivo ---
  function renderAgentGroup(container, agentesGrupo){
    container.innerHTML = "";
    agentesGrupo.forEach(agente => {
      const data = cachedData[agente];
      const fotos = getFotosDe(data);
      const row = document.createElement("div");
      row.className = "agent-row";

      let thumbHtml;
      if (fotos.length) {
        const badge = fotos.length > 1 ? `<span class="badge">+${fotos.length - 1}</span>` : "";
        thumbHtml = `<div class="thumb-wrap"><img class="thumb" src="${fotos[0]}">${badge}</div>`;
      } else {
        thumbHtml = `<div class="thumb empty">s/f</div>`;
      }

      let infoHtml;
      if (data) {
        const activas = data.cuentasActivas || {};
        const nombresActivos = CUENTAS.filter(c => activas[c]);
        const tagsHtml = nombresActivos.length
          ? `<div class="cuentas-tags">${nombresActivos.map(n => `<span class="tag">${n}</span>`).join("")}</div>`
          : `<div class="cuentas-tags"><span class="tag-none">Sin cuentas activas</span></div>`;
        infoHtml = `<div class="info">
             <div class="name">${agente} <span class="shift-tag">${data.turno || ""}</span></div>
             ${data.nombreAgente ? `<div class="meta" style="margin-top:0;">${data.nombreAgente}</div>` : ""}
             <div class="meta"><span class="n-cuentas">${nombresActivos.length}/${CUENTAS.length}</span> cuentas · ${data.marcaNotebook}</div>
             ${tagsHtml}
           </div>`;
      } else {
        infoHtml = `<div class="info">
             <div class="name">${agente}</div>
             <div class="empty-note">Sin registro cargado</div>
           </div>`;
      }

      row.innerHTML = thumbHtml + infoHtml;

      if (fotos.length) {
        row.querySelector(".thumb").addEventListener("click", (ev) => {
          ev.stopPropagation();
          openModal(fotos, 0);
        });
      }

      row.addEventListener("click", () => {
        selAgente.value = agente;
        selAgente.dispatchEvent(new Event("change"));
        window.scrollTo({ top: 0, behavior: "smooth" });
      });

      container.appendChild(row);
    });
  }

  onSnapshot(collection(db, COLLECTION), (snap) => {
    cachedData = {};
    snap.forEach(d => { cachedData[d.data().agente] = d.data(); });

    renderAgentGroup(agentListTitulares, AGENTES_TITULARES);
    renderAgentGroup(agentListFranco, AGENTES_FRANCO);
  }, (err) => {
    agentListTitulares.innerHTML = `<div class="empty-state">Error al cargar datos: ${err.message}</div>`;
  });

  modalOverlay.addEventListener("click", () => modalOverlay.classList.remove("open"));
</script>

</body>
</html>
